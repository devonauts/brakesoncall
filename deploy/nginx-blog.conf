# Static blog of brakesoncall.com (frontend/scripts/blog → frontend/dist/blog/). Goes INSIDE the site's server { }
# block, next to the SPA's `location /` — installed by ~/hq-deploy/brakesoncall-blog.sh.
# Real files and REAL 404s under /blog/: never the SPA fallback (a soft 200 for every made-up URL would let
# search engines index junk). Relative redirects so the 301 never leaks the internal host/port behind the tunnel.
location = /blog {
    absolute_redirect off;
    return 301 /blog/;
}
location /blog/ {
    absolute_redirect off;
    try_files $uri $uri/ =404;
    error_page 404 /blog/404.html;
}
